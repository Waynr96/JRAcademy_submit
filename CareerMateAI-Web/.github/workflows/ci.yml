name: CI - Continuous Integration

# trigger conditions
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # job 1: code quality check
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard
      
      - name: Lint HTML
        run: |
          htmlhint "*.html" || echo "HTML检查完成"
      
      - name: Lint CSS
        run: |
          npx stylelint "**/*.css" --config-basedir . || echo "CSS检查完成"
        continue-on-error: true

# Job 2: build validation
  build:
    name: build validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "✅ 验证项目结构..."
          test -f index.html && echo "✓ index.html 存在"
          test -f styles.css && echo "✓ styles.css 存在"
          test -f script.js && echo "✓ script.js 存在"
          test -d assets && echo "✓ assets 文件夹存在"
      
      - name: Check file sizes
        run: |
          echo "📊 检查文件大小..."
          find . -name "*.html" -o -name "*.css" -o -name "*.js" | while read file; do
            size=$(wc -c < "$file")
            echo "$(basename $file): ${size} bytes"
          done

  # Job 3: deploy preview
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment message
        run: |
          echo "🚀 准备部署预览环境..."
          echo "分支: ${{ github.head_ref }}"
          echo "提交: ${{ github.sha }}"
          echo "📝 这里可以集成 Netlify, Vercel 等部署服务"

  # Job 4: security check
  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive data
        run: |
          echo "🔒 检查敏感信息..."
          # 检查是否有API密钥acceeeKey，密码secret等
          if grep -r "API_KEY\|password\|secret" --include="*.js" --include="*.html" .; then
            echo "⚠️  警告: 发现可能的敏感信息"
            exit 1
          else
            echo "✅ 未发现敏感信息"
          fi
