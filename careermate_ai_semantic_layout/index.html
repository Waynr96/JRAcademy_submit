<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerMate AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-container">
        <div class="logo">
          <img
            src="./assets/logo.png"
            alt="CareerMate AI Logo"
            class="logo-icon"
          />
          <img
            src="./assets/career-mate-ai-2.png"
            alt="CareerMate AI Text Logo"
            class="logo-icon"
          />
        </div>
        <div class="nav-links">
          <a href="#Features" class="nav-link">Features</a>
          <a href="#Demo" class="nav-link">Demo</a>
        </div>
        <div class="nav-buttons">
          <a href="#signin" class="btn-signin">Sign In</a>
          <a href="#start" class="btn-start">Get Started for Free</a>
        </div>
      </div>
    </nav>

    <main>
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">Your AI Career Practice Partner</h1>
          <p class="hero-description">
            Get job-ready with AI — from resumes to interviews,
            <br />
            CareerMate AI coaches you step by step.
          </p>
          <div class="hero-buttons">
            <a href="#start" class="btn-hero-primary">
              Start for Free
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M4 10H16M16 10L10 4M16 10L10 16"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <a href="#demo" class="btn-hero-secondary">
              Watch Demo
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M4 10H16M16 10L10 4M16 10L10 16"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
          <img
            src="./assets/hero-image.png"
            alt="hero-decoration"
            class="hero-image"
          />
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
